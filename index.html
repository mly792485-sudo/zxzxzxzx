<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نور الإسلام" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-orientation" content="portrait" />
    <meta name="theme-color" content="#04090A" />
    <meta name="color-scheme" content="dark" />

    <!-- استخدم مسارات نسبية حتى تعمل الملفات داخل Capacitor WebView وGitHub Pages -->
    <link rel="icon" type="image/png" href="./app-icon.png" />
    <link rel="shortcut icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./app-icon.png" />
    <link rel="manifest" href="./manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@200..1000&family=Alexandria:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>نور الإسلام - مواقيت الصلاة، الأذان، القرآن والأذكار</title>
  </head>

  <body class="bg-[#04090A] text-slate-100 antialiased" style="background:#04090A;color:#F8FAFC;">
    <div id="root"></div>

    <!-- لا تترك WebView سوداء بصمت أثناء تحميل React أو عند حدوث خطأ مبكر -->
    <div id="boot-status" role="status" aria-live="polite" dir="rtl">
      <div class="boot-card">
        <strong>جاري تشغيل نور الإسلام</strong>
        <span>يرجى الانتظار قليلاً...</span>
      </div>
    </div>

    <style>
      #boot-status {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #04090a;
        color: #ecfdf5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-card {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 28px;
        text-align: center;
      }

      .boot-card span {
        color: #a7f3d0;
        font-size: 14px;
      }

      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(167, 243, 208, 0.25);
        border-top-color: #34d399;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #boot-status.boot-error {
        place-items: start center;
        box-sizing: border-box;
        padding: 24px;
      }

      #boot-status.boot-error .boot-card {
        display: flex;
        max-width: 520px;
        margin-top: 18vh;
        border: 1px solid rgba(248, 113, 113, 0.35);
        border-radius: 20px;
        background: #0c181a;
      }

      #boot-status.boot-error .boot-spinner {
        display: none;
      }

      #boot-status code {
        display: block;
        max-width: 100%;
        margin-top: 8px;
        color: #fca5a5;
        font-size: 12px;
        direction: ltr;
        word-break: break-word;
      }

      noscript {
        display: block;
        padding: 24px;
        color: #fecaca;
        text-align: center;
      }
    </style>

    <script>
      (function () {
        var status = document.getElementById("boot-status");
        var root = document.getElementById("root");
        var mounted = false;

        function removeStatus() {
          if (!mounted && root && root.hasChildNodes()) {
            mounted = true;
            status && status.remove();
          }
        }

        function showError(message) {
          if (!status || mounted) return;
          status.className = "boot-error";
          status.innerHTML =
            '<div class="boot-card">' +
            "<strong>تعذر تشغيل التطبيق</strong>" +
            "<span>أعد بناء التطبيق بعد معالجة الخطأ التالي:</span>" +
            '<code></code></div>';
          var code = status.querySelector("code");
          if (code) code.textContent = String(message || "Unknown startup error");
        }

        if (root && window.MutationObserver) {
          new MutationObserver(removeStatus).observe(root, { childList: true, subtree: true });
        }

        window.addEventListener("error", function (event) {
          showError(event.error || event.message);
        });

        window.addEventListener("unhandledrejection", function (event) {
          showError(event.reason);
        });

        window.setTimeout(function () {
          removeStatus();
          if (root && !root.hasChildNodes()) {
            showError("React did not mount within 15 seconds");
          }
        }, 15000);
      })();
    </script>

    <!-- Vite يحوّل هذا المسار تلقائياً إلى روابط ./assets عند npm run build -->
    <script type="module" src="/src/main.tsx"></script>

    <noscript>يلزم تفعيل JavaScript لتشغيل تطبيق نور الإسلام.</noscript>
  </body>
</html>
